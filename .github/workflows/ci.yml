name: CI

on:
  push:
    branches: [Main, feat/**]
  pull_request:
    branches: [Main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk vulnerability scan
        run: snyk test --command=python3
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
